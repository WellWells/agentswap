name: Feature request
description: Suggest a change, a new command or support for another agent.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation first, not the solution. "I keep a work and a personal Codex account and..." is more useful than "add a --foo flag".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you imagine it working. A sample command and its output is ideal.
      render: text
  - type: dropdown
    id: agent
    attributes:
      label: Which agent is this about?
      multiple: true
      options:
        - Codex
        - Claude Code
        - Antigravity CLI
        - A new agent
        - All of them
  - type: textarea
    id: new-agent
    attributes:
      label: For a new agent
      description: Where does it keep its login (file path, OS keychain entry)? Does it rotate refresh tokens? Is there a usage or quota endpoint? Links to its docs or source help a lot.
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to send a pull request for this.
