name: Bug report
description: Something does not work the way the README or the help says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The fields below are the ones I end up asking about anyway, so filling them in usually saves a round trip.

        **Before pasting anything:** replace emails with something like `a@example.com` and never paste the contents of `auth.json`, `.credentials.json`, `.claude.json` or anything under `~/.agentswap`. agentswap never needs your tokens to debug a problem.
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Codex (cxswap)
        - Claude Code (ccswap)
        - Antigravity CLI (agswap)
        - agentswap itself (install, update, link, lang)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: agentswap version
      description: Output of `agentswap version`.
      placeholder: agentswap v1.0.0
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent CLI version
      description: "`codex --version`, `claude --version` or `agy --version`, if it matters here."
      placeholder: codex-cli 0.160.1
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple silicon)
        - macOS (Intel)
        - Linux (x86_64)
        - Linux (arm64)
        - Windows (x64)
        - Windows (arm64)
        - Other
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS version and shell
      placeholder: macOS 15.5, zsh / Windows 11 24H2, PowerShell 7.5 / Ubuntu 24.04, bash
  - type: dropdown
    id: install
    attributes:
      label: How did you install agentswap?
      options:
        - install.sh
        - install.ps1
        - Homebrew
        - go install
        - Built from source
        - Downloaded an archive from Releases
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What did you run?
      description: The exact commands, in order.
      render: shell
      placeholder: |
        cxswap add work
        cxswap 2
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What happened?
      description: Paste the full output, with emails replaced. If the command printed nothing, say so.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: Anything unusual about your setup?
      description: |
        For example: `CODEX_HOME`, `CLAUDE_CONFIG_DIR` or `AGENTSWAP_HOME` set to a custom path; `cli_auth_credentials_store` in Codex's `config.toml`; the agent running inside an IDE or the desktop app; several machines sharing a home directory; a proxy.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed emails, tokens and account IDs from everything above.
          required: true
