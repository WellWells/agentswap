name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - run: go vet ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os == 'Windows'
        run: go test ./...
      - if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"

  min-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: stable
      - env:
          GOPROXY: 'off'
          GOFLAGS: -mod=mod
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          go run ./tools/dist -version "dev-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@v4
        with:
          name: agentswap-${{ github.sha }}
          path: dist/
          retention-days: 14
